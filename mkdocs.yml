site_name: Mandala Navīna
site_description: Drupal 11 rebuild of the Mandala Digital Asset Library — University of Virginia Library
site_url: https://uvalib.github.io/mandala-navina/
repo_url: https://github.com/uvalib/mandala-navina
repo_name: uvalib/mandala-navina

plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: false
      type: date

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

docs_dir: docs

extra_css:
  - stylesheets/extra.css

