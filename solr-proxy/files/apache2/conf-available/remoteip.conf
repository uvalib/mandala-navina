#
# Log the real client IP when behind a load balancer / reverse proxy.
#
# IMPORTANT: Only trust proxy IP ranges you control. The defaults below
# assume the load balancer is on a private network (RFC1918) or loopback.
#

RemoteIPHeader X-Forwarded-For

# Common private ranges used by LBs/proxies inside VPCs / clusters.
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
RemoteIPInternalProxy 127.0.0.1

# Optional: if you also have IPv6 internal proxies, add them here.
# RemoteIPInternalProxy fc00::/7

