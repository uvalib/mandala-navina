<VirtualHost *:80>
	#ServerName www.example.com

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	LogLevel info

	# Use the address after mod_remoteip has processed X-Forwarded-For.
	# This ensures the access log records the real client IP (not the LB IP).
	LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined_realip

	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

        SetEnvIf User-Agent "^ELB-HealthChecker" skiplog=1
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined_realip env=!skiplog

	Include proxy-conf/*.conf
</VirtualHost>

# vim: syntax=apache ts=4 sw=4 sts=4 sr noet
