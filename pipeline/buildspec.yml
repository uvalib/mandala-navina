version: 0.2

# Builds Docker image and pushes to ECR
# Follows drupal-dsf/pipeline/buildspec.yml pattern

env:
  variables:
    CONTAINER_IMAGE: "uvalib/mandala-drupal"
  parameter-store:
    AWS_ACCOUNT_ID: "/this/aws/accountid"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - BUILD_TAG=$(date +%Y%m%d%H%M%S)
      - GIT_COMMIT=$(git rev-parse --short HEAD)
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$CONTAINER_IMAGE

  build:
    commands:
      - echo Building Docker image...
      - docker build -f package/Dockerfile -t $IMAGE_URI:$BUILD_TAG -t $IMAGE_URI:latest .

  post_build:
    commands:
      - echo Pushing image to ECR...
      - docker push $IMAGE_URI:$BUILD_TAG
      - docker push $IMAGE_URI:latest
      - aws ssm put-parameter --name "/mandala/drupal/build_tag" --value "$BUILD_TAG" --type String --overwrite
      - echo Build complete. Tag $BUILD_TAG
