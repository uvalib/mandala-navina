id: collection_gallery_av
label: 'Collection gallery (Audio/Video)'
module: views
description: "AV9's gallery variant of the shanti-thumbnail card component (Sprint 3): audio/video nodes scoped to one collection + its subcollections -- embedded on a collection's own page (shanti_collections_view) alongside the Images-only masonry collection_gallery. Rendered as node--audio--teaser/node--video--teaser cards, not the shanti_grid_view masonry style, since AV content carries no IIIF dimensions for it to lay out against. See docs/sprints/sprint-03-av-core-implementation.md (AV9)."
