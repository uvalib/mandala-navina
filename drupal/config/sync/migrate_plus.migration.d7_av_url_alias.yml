uuid: 03e87e46-4ae8-42a5-bb24-03760c1a7cff
langcode: en
status: true
dependencies: {  }
id: d7_av_url_alias
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - 'Mandala AV'
  - 'Sprint 3 AV4'
  - 'ADR 016'
migration_group: mandala_av
label: 'AV: url_alias rows for audio/video nodes → D11 path_alias entities'
# 11,900 alias rows across all 11,583 AV nodes -- every AV node has at least
# one, and 317 have more than one because D7 pathauto left the older alias in
# place when a title changed. Each of those is a URL somebody may have saved,
# so the source is keyed on `pid` (one row per ALIAS, not per node) and none
# are deduplicated. See ADR 016 decision 7.
#
# D7's AV aliases are already namespaced `audio/...` and `video/...`, which is
# the shape ADR 016 specifies for D11, so these carry over unchanged.
source:
  plugin: d7_image_url_alias
  key: migrate_av
  node_types:
    - audio
    - video
  constants:
    node_path_prefix: /node/
    leading_slash: /
process:
  _d11_nid:
    plugin: migration_lookup
    migration:
      - d7_av_audio
      - d7_av_video
    source: nid
  _skip_unmigrated:
    plugin: skip_on_empty
    method: row
    source: '@_d11_nid'
  path:
    plugin: concat
    source:
      - constants/node_path_prefix
      - '@_d11_nid'
  alias:
    plugin: concat
    source:
      - constants/leading_slash
      - alias
  langcode:
    plugin: default_value
    source: language
    default_value: und
  status:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:path_alias'
idMap: {  }
migration_dependencies:
  required:
    - d7_av_audio
    - d7_av_video
include: null
