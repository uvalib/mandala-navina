id: d7_images_collections
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - 'Mandala Images'
  - 'Sprint 1 1b.2'
migration_group: mandala_images
label: 'D7 Images: collection nodes → Group entities (collection bundle)'
source:
  plugin: d7_node
  node_type: collection
process:
  label: title
  status: status
  created: created
  changed: changed
  # Real D7 creator uid, 1:1 identity-mapped to D11 uid by the user migration
  # (verified 2026-09-02: 0 of 171 source collection/subcollection nodes have
  # uid=0, so Group's uid=0-on-insert bug never actually applies to this data
  # - the prior blanket default_value:1 workaround discarded real ownership
  # for no reason). See docs/deferred/d7-shared-user-database.md.
  uid: uid
  field_group_access: group_access/0/value
  field_legacy_nid: nid
  field_legacy_site:
    plugin: default_value
    default_value: images
  field_overview/value: body/0/value
  field_overview/summary: body/0/summary
  # D7's 'filtered_html' format has no D11 equivalent (D11's formats are
  # basic_html/full_html/plain_text/restricted_html) -- default_value
  # matches the convention already used for every other formatted-text
  # field in d7_images_shanti_image.yml, not a per-row format lookup.
  field_overview/format:
    plugin: default_value
    default_value: basic_html
  field_featured_image/target_id:
    - plugin: skip_on_empty
      method: process
      source: field_general_featured_image/0/fid
    - plugin: migration_lookup
      migration: d7_images_collection_featured_image
      source: field_general_featured_image/0/fid
destination:
  plugin: 'entity:group'
  default_bundle: collection
idMap: {  }
migration_dependencies:
  optional:
    - d7_images_collection_featured_image
include: null
