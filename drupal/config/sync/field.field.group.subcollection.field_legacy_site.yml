label: 'Legacy D7 site'
description: 'Which D7 site (and therefore which nid sequence) this entity was migrated from. D7 nids are unique PER SITE, not globally, so field_legacy_nid alone is ambiguous once more than one collection has migrated: node/1631632 on images is a different asset than on av. Together the pair is the composite legacy key. Values are the kmassets service vocabulary, so joining site and nid with a hyphen reconstructs the D7-era kmasset uid directly. System/provenance value, not editor-facing.'
