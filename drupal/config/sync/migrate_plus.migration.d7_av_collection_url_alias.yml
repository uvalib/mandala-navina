uuid: 44b22e18-66d0-4e6f-bd71-e0b51b838c70
langcode: en
status: true
dependencies: {  }
id: d7_av_collection_url_alias
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - 'Drupal 7'
  - 'Mandala AV'
  - 'Sprint 3 AV4'
  - 'ADR 016'
migration_group: mandala_av
label: 'AV: url_alias rows for collection/subcollection nodes → D11 path_alias entities'
# 247 alias rows across all 237 AV collections and subcollections.
#
# The destination path is /group/{id}, not /node/{id}: AV collections became
# Group entities, exactly as the Images collections did. Same source plugin as
# d7_av_url_alias, different path construction -- which is why the node-type
# filter lives in the source and the path shape lives here.
source:
  plugin: d7_image_url_alias
  key: migrate_av
  node_types:
    - collection
    - subcollection
  constants:
    group_path_prefix: /group/
    leading_slash: /
process:
  _d11_gid:
    plugin: migration_lookup
    migration:
      - d7_av_collections
      - d7_av_subcollections
    source: nid
  _skip_unmigrated:
    plugin: skip_on_empty
    method: row
    source: '@_d11_gid'
  path:
    plugin: concat
    source:
      - constants/group_path_prefix
      - '@_d11_gid'
  alias:
    plugin: concat
    source:
      - constants/leading_slash
      - alias
  langcode:
    plugin: default_value
    source: language
    default_value: und
  status:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:path_alias'
idMap: {  }
migration_dependencies:
  required:
    - d7_av_collections
    - d7_av_subcollections
include: null
