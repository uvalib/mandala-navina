spike13_render.book:
  path: '/spike13/book/{node}'
  defaults:
    _controller: '\Drupal\spike13_render\Controller\WholeBookController::view'
    _title: 'Spike 13 whole book'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
spike13_render.text:
  path: '/spike13/text/{node}'
  defaults:
    _controller: '\Drupal\spike13_render\Controller\WholeBookController::text'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
spike13_render.pubreader:
  path: '/spike13/pubreader/{node}'
  defaults:
    _controller: '\Drupal\spike13_render\Controller\WholeBookController::pubreader'
  requirements:
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node
