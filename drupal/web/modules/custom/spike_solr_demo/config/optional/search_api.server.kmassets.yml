id: kmassets
name: 'KMassets (external Mandala Solr)'
description: 'Read-only connection to the existing kmassets Solr index managed by the Mandala ingest pipeline.'
backend: search_api_solr
backend_config:
  site_hash: false
  retrieve_data: true
  highlight_data: false
  domain: generic
  server_prefix: ''
  connector: standard
  connector_config:
    scheme: https
    host: mandala-solr-proxy.internal.lib.virginia.edu
    port: 443
    path: /
    core: kmassets
    timeout: 5
    index_timeout: 20
    optimize_timeout: 5
    finalize_timeout: 30
    solr_version: '7'
    http_method: AUTO
    commit_within: 1000
    jmx: false
    jts: false
    solr_install_dir: ''
    skip_schema_check: true
  optimize: false
  fallback_multiple: true
status: true
langcode: en
dependencies:
  module:
    - search_api_solr
