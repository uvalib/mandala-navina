id: d7_images_subcollections
label: 'D7 Images: subcollection nodes → Group entities (subcollection bundle)'
migration_group: mandala_images
migration_tags:
  - 'Drupal 7'
  - 'Mandala Images'
  - 'Sprint 1 1b.2'

source:
  plugin: d7_image_subcollection
  node_type: subcollection

process:
  label: title
  status: status
  created: created
  changed: changed
  # Real D7 creator uid, 1:1 identity-mapped to D11 uid by the user migration
  # (verified 2026-09-02: 0 of 171 source collection/subcollection nodes have
  # uid=0, so Group's uid=0-on-insert bug never actually applies to this data
  # - the prior blanket default_value:1 workaround discarded real ownership
  # for no reason). See docs/deferred/d7-shared-user-database.md.
  uid: uid

  # D7 group_access field: 0=public, 1=private, 2=subscribable.
  field_group_access: group_access/0/value

  # Preserve D7 nid for lookups and audit trails. Mandatory on every
  # content-entity migration — see
  # docs/deferred/migration-legacy-nid-required-convention.md
  field_legacy_nid: nid
  # Composite legacy key: D7 nids are unique PER SITE, not globally, so
  # field_legacy_nid alone is ambiguous once a second site migrates. Constant
  # here because each migration reads exactly one D7 database. Value is the
  # kmassets service token, so legacy_site + '-' + legacy_nid reconstructs the
  # D7-era kmasset uid directly.
  field_legacy_site:
    plugin: default_value
    default_value: images

  # Parent collection: D7 nid → D11 Group id via migration_lookup.
  field_parent_collection/target_id:
    plugin: migration_lookup
    migration: d7_images_collections
    source: parent_collection_nid
    no_stub: true

destination:
  plugin: 'entity:group'
  default_bundle: subcollection

migration_dependencies:
  required:
    - d7_images_collections
