id: d7_images_collection_memberships
label: 'D7 Images: OG user memberships → Group membership relationships'
migration_group: mandala_images
migration_tags:
  - 'Drupal 7'
  - 'Mandala Images'
  - 'Sprint 1 1b.2'

source:
  plugin: d7_image_user_group_membership

process:
  gid:
    plugin: migration_lookup
    migration:
      - d7_images_collections
      - d7_images_subcollections
    source: gid
    no_stub: true

  # D7 uids map 1:1 to D11 (user migration not yet done; uid 1 = admin in D11).
  entity_id: etid

  plugin_id:
    plugin: default_value
    default_value: 'group_membership'

destination:
  plugin: mandala_group_relationship

migration_dependencies:
  required:
    - d7_images_collections
    - d7_images_subcollections
