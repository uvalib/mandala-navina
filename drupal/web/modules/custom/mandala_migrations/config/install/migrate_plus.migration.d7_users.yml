id: d7_users
label: 'D7 shared users → D11 user accounts (uid-preserving)'
migration_group: mandala_users
migration_tags:
  - 'Drupal 7'
  - 'Mandala Users'

# Reads the shared user base (mandala_shared / mandala_d7_shared) via the
# group's `migrate_users` connection. The d7_user source plugin excludes the
# anonymous user (uid 0) automatically.
source:
  plugin: d7_user

process:
  # ── uid preservation is MANDATORY — do not remove. ─────────────────────────
  # d7_images_collection_memberships maps `entity_id: etid` (the raw D7 uid)
  # with NO migration_lookup and NO stub. If this migration lets D11 assign new
  # uids, all ~111k membership references point at the wrong (or nonexistent)
  # accounts. D7 uid 1 (admin) maps onto D11 uid 1 (admin) — an accepted
  # overwrite; the source plugin already drops uid 0.
  # See docs/deferred/d7-shared-user-database.md.
  uid: uid

  name: name
  # phpass hashes carry over cleanly, but production auth is SAML/NetBadge
  # (see d7_user_authmap) — local passwords are a fallback path only.
  pass: pass
  mail: mail
  init: init
  status: status
  created: created
  changed: created
  access: access
  login: login
  timezone: timezone

  # Single-language site — pin to English rather than depending on a D7
  # language migration.
  langcode:
    plugin: default_value
    default_value: en
  preferred_langcode:
    plugin: default_value
    default_value: en
  preferred_admin_langcode:
    plugin: default_value
    default_value: en

  # Array of D7 rids → D11 role machine names, mapped element-wise WITHOUT ever
  # saving a role config entity. Replaces the old migration_lookup→d7_user_role
  # indirection, whose entity:user_role destination wiped committed role
  # permissions on save.
  #
  # Per ADR 015 (editorial access model), only D7 rid 6 (shanti editor) → D11
  # content_editor. shanti editor was a GLOBAL editorial role that overrode
  # per-group permissions — content_editor is its D11 realization. rid 4 (editor)
  # was GROUP-SCOPED (real grant lived in Organic Groups per-collection); it is
  # deliberately NOT promoted to the global content_editor role — its per-group
  # editing is restored later, in the group user-membership/role migration
  # (Phase B), as a per-group Group role. rid 5 (workflow editor) was AV-only and
  # vestigial. rids 4/5 therefore migrate as plain authenticated users here.
  # rids 1/2 (anonymous/authenticated) are implicit in D7 / locked in D11 and are
  # deliberately absent. See docs/adr/015-editorial-access-model-global-content-editor.md
  # and docs/deferred/d7-editor-permissions-og-group-scoped-not-migrated.md.
  roles:
    plugin: mandala_role_map
    source: roles
    map:
      3: administrator
      6: content_editor

  # NOTE: user_picture intentionally omitted — no d7_file/user-picture migration
  # exists yet and Mandala accounts don't rely on avatars. Add later if needed.
  # NOTE: field_first_name / field_last_name / realname live in the shared DB too
  # (see the deferred doc's prefix list). D11 has no realname module by default;
  # decide during laptop migration-dev whether to add core name fields + map them
  # here, or bring in the realname module.

destination:
  plugin: 'entity:user'

# d7_user_role removed: role translation is now handled in-process by the
# mandala_role_map plugin above, so there is no lookup migration to depend on.
migration_dependencies:
  optional: []
