services:
  # The orchestrator: builds the flat kmassets doc from a node by running the
  # common-core base layer, then every tagged contributor (the D11 equivalent of
  # D7's drupal_alter('kmaps_fields_solr_doc')), then post-alter normalization.
  mandala_kmassets_sync.doc_builder:
    class: Drupal\mandala_kmassets_sync\KmassetDocBuilder
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - !tagged_iterator mandala_kmassets_sync.doc_contributor

  # Image-specific fields (D7 shanti_images_kmaps_fields_solr_doc_alter).
  mandala_kmassets_sync.contributor.image:
    class: Drupal\mandala_kmassets_sync\Contributor\ImageFieldContributor
    arguments:
      - '@shanti_iiif.url_builder'
    tags:
      - { name: mandala_kmassets_sync.doc_contributor, priority: 0 }

  # Collection / access-path fields (D7 shanti_collections_kmaps_fields_solr_doc_alter).
  # Security-critical subset only (visibility_i/visibility_s, collection_uid_s);
  # see class docblock for what's deliberately out of scope.
  mandala_kmassets_sync.contributor.collection:
    class: Drupal\mandala_kmassets_sync\Contributor\CollectionFieldContributor
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: mandala_kmassets_sync.doc_contributor, priority: 10 }

  # Direct-to-master Solr sink: POSTs the built doc synchronously to the
  # Solr master update endpoint. URL configured in mandala_kmassets_sync.settings.
  mandala_kmassets_sync.direct_sink:
    class: Drupal\mandala_kmassets_sync\KmassetDirectSink
    arguments:
      - '@http_client'
      - '@mandala_kmassets_sync.doc_builder'
      - '@config.factory'
      - '@logger.factory'
  # Class-name alias so AutowireTrait (Drush 13) can resolve KmassetDirectSink
  # by type hint when instantiating Drush command classes.
  Drupal\mandala_kmassets_sync\KmassetDirectSink:
    alias: mandala_kmassets_sync.direct_sink
    public: true

  # Suppresses per-node Solr sync while a migration import/rollback runs, so a
  # 111k-node migration does not fan out one inline write per node to the real
  # kmassets master (index deliberately afterwards via kmassets:index-all). The
  # node hooks consult this service's isSuppressed().
  mandala_kmassets_sync.migrate_suppressor:
    class: Drupal\mandala_kmassets_sync\EventSubscriber\MigrateSyncSubscriber
    arguments:
      - '@logger.channel.mandala_kmassets_sync'
    tags:
      - { name: event_subscriber }

  # Dedicated logger channel for the module.
  logger.channel.mandala_kmassets_sync:
    parent: logger.channel_base
    arguments:
      - 'mandala_kmassets_sync'

  # Audits the kmassets index against Drupal node state (1a.9): detects and
  # optionally repairs missing / stale / orphaned docs.
  mandala_kmassets_sync.auditor:
    class: Drupal\mandala_kmassets_sync\KmassetAuditor
    arguments:
      - '@entity_type.manager'
      - '@mandala_kmassets_sync.direct_sink'
      - '@config.factory'
  # Class-name alias for AutowireTrait (Drush 13).
  Drupal\mandala_kmassets_sync\KmassetAuditor:
    alias: mandala_kmassets_sync.auditor
    public: true


