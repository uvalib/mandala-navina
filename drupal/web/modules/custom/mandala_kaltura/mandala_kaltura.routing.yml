mandala_kaltura.secrets_form:
  path: '/admin/config/media/mandala-kaltura/secrets'
  defaults:
    _form: '\Drupal\mandala_kaltura\Form\KalturaSecretsForm'
    _title: 'Mandala Kaltura secrets'
  requirements:
    _permission: 'administer mandala kaltura secrets'

# AV11: mints a short-lived Kaltura upload session for AV12's browser-direct
# upload widget. Access is node-scoped when a `?node=` query param is
# present (requires update access to that specific node); otherwise falls
# back to the generic create permission for the node *add* form case,
# where no node exists yet to check access against -- see
# UploadSessionController::access()'s docblock for why this matters (the
# minted KS itself is partner-account-wide, not entry-scoped).
mandala_kaltura.upload_session:
  path: '/api/kaltura/upload-session'
  defaults:
    _controller: '\Drupal\mandala_kaltura\Controller\UploadSessionController::mint'
  requirements:
    _custom_access: '\Drupal\mandala_kaltura\Controller\UploadSessionController::access'
