# Site-level constants are the real, live production values (Sprint 3 design
# note, `variable` table dump) — not secret, committed directly like every
# other non-secret value in config/sync (see the AV10 scope note's "Secrets"
# section for why partner_id/subp_id/server_url don't need settings.php
# env-var plumbing the way the credential pair does).
partner_id: '381832'
subp_id: '38183200'
server_url: '//www.kaltura.com'

# Only one preset seeded here, deliberately: 31832371, confirmed AV13
# (2026-09-17) as D7's real primary-playback uiconf_id two independent
# ways -- the live React app's AudioVideo.DrawPlayer() (its only reachable
# code path) hardcodes it for both audio and video, and D7 Drupal's own
# field_video display instance independently configures the same value.
# No per-bundle split needed. See config/sync/mandala_kaltura.settings.yml
# (the live site's actual copy) for the full writeup of what this
# supersedes and why.
presets:
  default:
    uiconf_id: '31832371'
    custom_cw: ''
    delivery: HTTP
    player_height: 425
    player_width: 880
    thumbsize_height: 45
    thumbsize_width: 80
    rotate: 0
    stretch: null
    custom_player: ''
