services:

  # The one read path for a transcript's text: access-checked, a single indexed
  # range read. Viewers and APIs go through this, never through entity loads of
  # individual units.
  mandala_av_transcripts.reader:
    class: Drupal\mandala_av_transcripts\TranscriptReader
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@current_user'
