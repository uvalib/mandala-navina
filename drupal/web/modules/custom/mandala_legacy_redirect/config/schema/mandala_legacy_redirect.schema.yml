mandala_legacy_redirect.settings:
  type: config_object
  label: 'Mandala legacy redirect settings'
  mapping:
    canonical_base_url:
      type: string
      label: 'Base URL redirects point at. Empty keeps the redirect on the requesting host.'
    hosts:
      type: sequence
      label: 'Legacy hostname to field_legacy_site token'
      sequence:
        type: mapping
        label: 'Host mapping'
        mapping:
          host:
            type: string
            label: 'Legacy hostname (lowercase)'
          site:
            type: string
            label: 'field_legacy_site token'
