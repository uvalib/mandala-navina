# Interim hardening for PHP2Shell (CVE-2026-109618 and CVE-2026-109619), 2026-10-21.
# Not a fix: only a PHP release 8.3.36 or later is. See
# package/data/files/usr/local/etc/php/conf.d/zz-mandala-security.ini.

# Refuse oversized request bodies before PHP parses them. Above PHP's own
# post_max_size (8M), so it never rejects a request PHP would have accepted.
LimitRequestBody 10485760

# The same upload-progress switch as the ini file, set where applications cannot
# override it (.htaccess, ini_set). Guarded so the config still loads if the image
# ever moves off mod_php.
<IfModule mod_php.c>
    php_admin_flag session.upload_progress.enabled off
</IfModule>
