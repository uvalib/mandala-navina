; Interim hardening for PHP2Shell (CVE-2026-109618 and CVE-2026-109619), 2026-10-21.
; Not a fix: only a PHP release 8.3.36 or later is. These reduce exposure while the
; base image is still on an older PHP. Loaded last (zz-) so it wins over the base
; image's own ini files. Set here, not with ini_set() or .user.ini, which PHP says
; do not protect.

; Blocks the upload-progress path the CVE-2026-109619 memory-disclosure uses.
session.upload_progress.enabled = 0

; Small request bodies. These match what the base image already has; pinning them
; keeps a future base image from loosening them. PHP's advice for sites that need
; uploads is post_max_size of 32M or less, upload_max_filesize below it.
post_max_size = 8M
upload_max_filesize = 2M
