name: mandala
type: drupal11
docroot: drupal/web
composer_root: drupal
php_version: "8.3"
webserver_type: apache-fpm
database:
  # Match the staging/prod RDS engine (MySQL 8.4) so local runs validate under
  # the same collation (utf8mb4_0900_ai_ci) — critical for NFC/diacritic, sort,
  # and uniqueness fidelity in the Images migration (Sprint 1 1a.9). Was
  # mariadb 10.11, which forced a collation rewrite on dump import.
  # NOTE: changing this is destructive to the existing DDEV DB — `ddev delete`
  # (or `ddev debug migrate-database mysql:8.4`) then re-import.
  type: mysql
  version: "8.4"
composer_version: "2"
nodejs_version: "18"
use_dns_when_possible: true

hooks:
  post-start:
    - exec-host: if [ ! -d "drupal/vendor" ]; then ddev composer install --prefer-dist; fi

web_environment:
  - DRUPAL_HASH_SALT=temporary-local-dev-only
